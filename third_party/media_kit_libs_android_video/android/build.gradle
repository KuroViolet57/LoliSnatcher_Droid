import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

// LoliSnatcher: arm64-only libmpv builds from third_party/libmpv-android.
// - default-arm64-v8a.jar: "classic", libmpv-android-video-build v1.1.11 default
//   (libmpv.so + libmediakitandroidhelper.so). The published package downloads
//   v1.1.7 for every ABI.
// - ls-arm64-v8a.jar: token 153, our own mpv 0.41 build (libmpvls.so only), made
//   by third_party/libmpv-android/build/build_ls_libmpv.sh.
// The app picks one per process (Settings -> Video -> media_kit libmpv build).
task copyLibmpvJar {
    def jars = [
        ["name": "default-arm64-v8a.jar", "sha256": "2A906875AF68BE8C98C4A83C236BC24053F46E0ACCF62B115993EF1D740E98CC"],
        ["name": "ls-arm64-v8a.jar", "sha256": "1274F9F4CD9EA8F777D0E3FB761EB986A79648090715C1A25206E1B679339AA8"],
    ]
    def outputDir = file("$buildDir/output")

    doLast {
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()
        jars.each { jar ->
            def srcJar = file("${project.projectDir}/../../libmpv-android/${jar.name}")
            if (!srcJar.exists()) {
                throw new GradleException("Missing ${srcJar}. See third_party/libmpv-android/README.md")
            }
            def digest = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(srcJar.toPath()))
            def hex = digest.encodeHex().toString().toUpperCase()
            if (hex != jar.sha256) {
                throw new GradleException("SHA-256 mismatch for ${srcJar}: ${hex}")
            }
            copy {
                from srcJar
                into outputDir
            }
        }
    }
}

assemble.dependsOn(copyLibmpvJar)
preBuild.dependsOn(copyLibmpvJar)
